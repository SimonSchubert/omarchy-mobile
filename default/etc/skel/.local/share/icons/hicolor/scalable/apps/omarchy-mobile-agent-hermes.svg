<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- A wing, filled, and not the caduceus. The caduceus needs two snakes
       wound round a staff, and a pair of crossing serpents fills in solid at
       42px, which is the reason the codex tile is a hexagon rather than a knot.
       Cutting it back to the staff and its feathers did not work either: drawn
       as strokes radiating off a vertical stem, in both directions that were
       tried, it reads as a seedling rather than a wing.
       So one wing, as a silhouette with three scalloped feathers. Hermes is
       the messenger before he is anything else, and the mark is the only
       filled figure in this set besides the gemini spark. -->
  <defs>
    <linearGradient id="hermesTile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#4C1D95"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#hermesTile)"/>
  <path d="M26 96C26 64 46 34 98 24C90 44 80 56 66 64C80 63 90 60 100 54
           C90 72 78 80 62 84C74 85 82 84 92 82C76 95 52 100 26 96Z"
        fill="#ffffff"/>
</svg>
