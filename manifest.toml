# manifest.toml -- the version pins.
#
# The only file in this project that says what version of anything is built.
# Nothing clones at HEAD: every input this project does not itself version
# names its upstream and an exact commit, so two builds of the same manifest
# install the same bytes.
#
# Read it from bash with scripts/manifest.sh:
#
#   . scripts/manifest.sh
#   ref=$(manifest_get omarchy ref) || exit 1
#
# A missing or empty pin is a hard error there, never an empty string -- an
# unread pin that degrades to "" is a clone at HEAD wearing a disguise, which
# is the exact failure these pins exist to prevent.

# ---------------------------------------------------------------------------
# Upstream Omarchy -- the configuration and theme layer we vendor.
#
# UNPATCHED, and that is the whole point of this project. moarchy carries
# pkgbuilds/omarchy-config/port-4x.patch, 264 insertions that rewrite
# Quickshell.Hyprland into Quickshell.I3 because a PinePhone's Mali-400 tops
# out at GLES 2.0 and Hyprland's floor is 3.0. A VM has no such floor: Mesa's
# llvmpipe advertises GLES 3.2 in software, so Hyprland runs and the patch is
# not needed. Phase 1 is upstream Omarchy, byte for byte.
#
# Same commit moarchy pins, deliberately: two ports of one upstream that
# disagree about which upstream are two projects.
# ---------------------------------------------------------------------------
[omarchy]
url     = "https://github.com/basecamp/omarchy"
ref     = "0534987009061cbe2dacdde4ad564092ab698d12"
version = "v4.0.3"

# ---------------------------------------------------------------------------
# This project's own version.
# ---------------------------------------------------------------------------
[omarchy-mobile]
version = "0.1.0"

# ---------------------------------------------------------------------------
# Packages Arch Linux ARM is behind on, built here from Arch's own packaging
# repo so the versions match what the rest of the repo expects.
#
# hyprland is the whole reason this section exists. ALARM's aarch64 [extra]
# carries hyprland 0.56.1-3, built 2026-08-01 against libaquamarine.so=13. It
# then rebuilt aquamarine to 0.15.0-2 on 2026-09-04, which provides
# libaquamarine.so=14 -- and never rebuilt hyprland. pacstrap says so plainly:
#
#   :: unable to satisfy dependency 'libaquamarine.so=13-64' required by hyprland
#
# Every other dependency lines up (hyprutils .so=13, hyprlang .so=2,
# hyprgraphics .so=4, hyprcursor .so=0, hyprwire .so=3), so exactly one package
# is stale. Arch x86_64 already shipped the answer: hyprland 0.56.2-2 depends on
# libaquamarine.so=14-64. Building that tag for aarch64 is the fix.
#
# Building hyprland rather than pinning aquamarine back to 0.14 is deliberate.
# An old aquamarine would need an IgnorePkg forever and would break again on
# the guest's first `pacman -Syu`; a newer hyprland is what ALARM is heading
# towards anyway, so when it catches up its package supersedes ours and this
# section can be deleted.
#
# `ref` is the commit the tag points at, not the tag, so a moved tag cannot
# quietly change what gets built.
# ---------------------------------------------------------------------------
[pkg.hyprland]
url     = "https://gitlab.archlinux.org/archlinux/packaging/packages/hyprland.git"
tag     = "0.56.2-2"
ref     = "b8035f2fd4540f4f88c747846388027dce715d5d"

# ---------------------------------------------------------------------------
# xdg-terminal-exec is not behind in ALARM but absent from it: it lives in the
# AUR. It is built here because every terminal Omarchy opens goes through it --
# omarchy-launch-floating-terminal-with-presentation execs
# `xdg-terminal-exec --app-id=org.omarchy.terminal ...` -- and without it
# uwsm-app logs one line and nothing appears:
#
#   uwsm_app-daemon: sent: error 'Error: Command not found: "xdg-terminal-exec"' 1
#
# Settings bridges forty-odd of upstream's rows that way (docs/spec/settings.md
# E), so on an image without it those rows are taps that do nothing.
#
# The AUR's git repo keeps the PKGBUILD at its root, the same shape as Arch's
# packaging repos, so vm/build-packages.sh builds it unchanged. The AUR has no
# tags: `tag` is the pkgver-pkgrel this commit builds, for reading, and `ref`
# is what is checked out. The PKGBUILD pins its source tarball by sha256, and
# that sum was checked against the tarball when this pin was taken.
# ---------------------------------------------------------------------------
[pkg.xdg-terminal-exec]
url     = "https://aur.archlinux.org/xdg-terminal-exec.git"
tag     = "0.14.3-1"
ref     = "a52e8f23c0be7d482b944c6cf5ddee172da171e4"

# ---------------------------------------------------------------------------
# mise, and the reason a coding agent is a tap rather than a research project.
#
# The agent machinery is already on the image: upstream's whole bin/ lands in
# /usr/bin, so omarchy-agent, omarchy-default-agent and omarchy-mise-install
# are all there, and Pages.js already draws Apps > AI agent. Every one of those
# paths runs on mise:
#
#   grok) agent="grok"; agent_package="npm:@xai-official/grok"
#   ...
#   agent_install() { user_install || mise use -g "$agent_package"; }
#
# and mise is the single piece Arch Linux ARM does not have. aarch64/extra
# carries nodejs and npm and no mise at all, which is why this is a pin rather
# than a name in vm/packages/apps alone. Upstream Omarchy installs this same
# AUR package.
#
# Until this landed the AI agent row was guarded off (`when: omarchy-cmd-present
# mise`), which meant the drawer's settings index withheld it too: typing
# "agent" into the drawer answered nothing at all. That guard stays, because it
# is still the honest answer for a --session-only build; what changes is that
# on a full image it now says yes.
#
# A -bin package, and legitimately so: the PKGBUILD declares
# arch=('x86_64' 'aarch64') and fetches mise-v$pkgver-linux-arm64.tar.xz with
# its own sha256, which was checked against the tarball when this pin was taken.
# Its package() runs the arm64 binary to generate shell completions, which is
# fine in a native arm64 builder and is one more reason [builder] stays pinned
# to one rather than to an emulated image.
# ---------------------------------------------------------------------------
[pkg.mise-bin]
url     = "https://aur.archlinux.org/mise-bin.git"
tag     = "2026.9.5-1"
ref     = "00e537b20b8968c09bb3023236475cb2ce7b757c"

# ---------------------------------------------------------------------------
# The phone's Spotify, and the reason it is a package rather than a web app.
#
# The web player is on the image as a tile and cannot play a note: it asks for
# Widevine, and there is no Widevine for aarch64 Linux at all -- Arch's
# chromium ships no CDM, and every widevine package in the AUR is
# arch=('x86_64'), because Google publishes the Linux CDM for x86_64 only and
# the arm64 builds live inside ChromeOS and Android images. WebKitGTK has no
# CDM path either. So no browser on this image can play protected content, and
# swapping browsers does not change that (docs/build-log.md).
#
# librespot does not use EME at all. It speaks Spotify's own protocol, so it
# needs a Premium account and no CDM, which is the whole of why this works
# where the web player does not. Spot is the GTK4 + libadwaita client on top of
# it -- every one of its runtime dependencies (gtk4, libadwaita, glib2, cairo,
# pango, graphene, alsa-lib, libpulse, openssl) is already installed for the
# GNOME apps, so it costs a Rust build in the builder and almost nothing on the
# image.
#
# Upstream is slow rather than dead: 0.5.0 released 2024-12-17, last push
# 2025-10-13, not archived. The AUR packaging tracks that release, declares
# aarch64, and builds the tarball rather than a VCS checkout, so this ref pins
# the packaging and the release pins the code.
# ---------------------------------------------------------------------------
[pkg.spot-client]
url     = "https://aur.archlinux.org/spot-client.git"
tag     = "0.5.0-1"
ref     = "e9edb52471ce5694c419b5d2fee22549135ead5c"

# ---------------------------------------------------------------------------
# The on-screen keyboard: moarchy's, at the commit moarchy pins, for the reason
# [omarchy] gives -- two ports of one phone UI that type through two different
# keyboards are two projects.
#
# In no repo at all, so it is built here like xdg-terminal-exec. It is a Qt6
# client of zwp_input_method_v2 and zwp_virtual_keyboard_v1, both of which
# Hyprland advertises as Sway does, and it owns sm.puri.OSK0 on the session
# bus, which is the name the shell calls to put it away (gestures.md F3, I5d).
#
# Its PKGBUILD is in packaging/ rather than at the root, which is what
# `pkgbuilddir` says. It builds the checkout it sits in (`source=()`), so this
# ref pins the code as well as its packaging.
#
# The trap moarchy's pin warns about is the same here. A commit can name a fix
# that pacman never offers: a guest holding 0.1.0-3 compares versions, not
# contents, so a fix reaches an installed guest only once the keyboard's own
# PKGBUILD has moved its pkgrel. A freshly built image hides that completely.
# ---------------------------------------------------------------------------
[pkg.moarchy-keyboard]
url         = "https://github.com/SimonSchubert/moarchy-keyboard"
tag         = "0.1.0-3"
ref         = "f1f2dda18f96c5ae087336410bc4178f405cba6f"
pkgbuilddir = "packaging"

# ---------------------------------------------------------------------------
# Notes and the App Store: moarchy's two default apps, at the commits moarchy
# pins, for the reason [pkg.moarchy-keyboard] gives. Default rather than
# installable, as there: a phone with no way to write a note down, or to add an
# app by touch, is missing something a phone is for. Both are pure Python on
# GTK4 and libadwaita, which the image already carries, so each costs it about
# 100 KB installed (84 and 111 at these pins).
#
# Keep is pinned twice over. `ref` pins the packaging, and the PKGBUILD under
# aur/ -- the AUR's recipe, kept in the app's own repo -- sources a release
# tarball by sha256, so the pin names the exact code as well.
# ---------------------------------------------------------------------------
[pkg.moarchy-keep]
url         = "https://github.com/SimonSchubert/moarchy-keep"
tag         = "0.1.1-1"
ref         = "4b05488eb37c11a3ab68860ccabbc9be110fd074"
pkgbuilddir = "aur/moarchy-keep"

# The store is not, and it is the one entry in this file that clones at HEAD.
# Its PKGBUILD builds `moarchy-store-git` from `source=(git+$url.git)`, a VCS
# package: `ref` pins the PKGBUILD, and makepkg then clones the code again at
# whatever main is. moarchy records the same gap and leaves the fix where the
# recipe lives -- `#commit=` in that source array, or a release tarball as Keep
# has -- rather than editing someone else's recipe from here.
#
# What this side can do is refuse to build the wrong code quietly. pkgver()
# puts the short hash in the version, and vm/build-packages.sh fails when it is
# not this ref's. So when the store's main moves, this build stops, and the fix
# is a pin bump rather than an image that names one commit and holds another.
#
# Named for the package, not the repo, so the loop's "$name-*" glob and its
# stamp find what makepkg wrote.
[pkg.moarchy-store-git]
url     = "https://github.com/SimonSchubert/moarchy-store"
tag     = "0.1.0.r22.c08a073-1"
ref     = "c08a07379171bb0a4998cb94f07f4bfb2370c78f"

# ---------------------------------------------------------------------------
# The key that signs [moarchy], packaged so pacman can check a signature.
#
# The one entry here whose point is not the code in it. It installs the public
# half of `moarchy package signing` into /usr/share/pacman/keyrings, and its
# post_install runs `pacman-key --populate`, so the key is trusted before the
# repository below is ever consulted. Without it the stanza vm/configure.sh
# writes would have to say SigLevel = Never, and packages that install as root
# over a network deserve more than HTTPS alone.
#
# Chicken and egg, broken deliberately on this side: moarchy-keyring is itself
# in the signed repo, so the first install of it cannot be verified. The image
# builds it from this pinned commit instead, into the file:// repo that never
# leaves the container -- the same shape archlinux-keyring and danctnix-keyring
# use.
#
# Built from moarchy's tree rather than copied here, because a key defined in
# two places is a key that will eventually disagree with itself.
# ---------------------------------------------------------------------------
[pkg.moarchy-keyring]
url         = "https://github.com/SimonSchubert/moarchy"
tag         = "20260906-1"
ref         = "d0e5dd247620f350c91b32668b340889559d9ec1"
pkgbuilddir = "pkgbuilds/moarchy-keyring"

# ---------------------------------------------------------------------------
# The package repository the phone updates from, shared with moarchy.
#
# vm/configure.sh writes this into the guest's /etc/pacman.conf, appended after
# core/extra/alarm/aur so an upstream package of the same name always wins --
# nothing here should shadow the base system by accident.
#
# It is what makes an app installable rather than baked in: moarchy-store's
# helper execs `pacman -S` against its signed allowlist, and pacman can only
# reach a package that is in a sync database. An app packaged into this repo is
# in one; an app built only into the image is not, and can never be uninstalled
# and reinstalled by anybody.
#
# Shared with the PinePhone port rather than stood up again: both ports are
# aarch64 Arch, the packages are the same packages, and a second repository
# means a second key to guard and a second place to publish. What the two ports
# do not share is what they can RUN -- Flutter's Impeller wants GLES 3.0 and the
# PinePhone's Mali-400 stops at 2.0 -- but that is a question about each app,
# which moarchy-store's catalogue answers per entry with `tested`, not a
# question about where the bytes live.
#
# One fixed release tag, re-uploaded in place, so this URL never moves. moarchy
# owns the publishing side (repo/build.sh signs on the host so the private key
# never enters a container; repo/publish.sh uploads).
# ---------------------------------------------------------------------------
[repo]
name   = "moarchy"
server = "https://github.com/SimonSchubert/moarchy/releases/download/repo"
keyid  = "3CA83612E7F3108F442006B418305B893569BAD3"

# ---------------------------------------------------------------------------
# The aarch64 container everything is built in. Pinned by digest rather than
# by the `base-devel` tag: a floating tag is a clone at HEAD by another name.
#
# Re-resolve the tag to a digest with:
#   docker buildx imagetools inspect menci/archlinuxarm:base-devel
#
# Dockerfiles cannot read a file at FROM time, so this pin is written in two
# places -- here and in vm/Dockerfile. Keep them in step when bumping.
# ---------------------------------------------------------------------------
[builder]
image  = "menci/archlinuxarm"
tag    = "base-devel"
digest = "sha256:f7c6f64c0f246f41775e01793340c49f8e9abf3991141c25405361d56b100ccb"

# ---------------------------------------------------------------------------
# The VM. Not versions, but the numbers that define the target device -- they
# live here for the same reason the pins do: one place that answers "what is
# being built", so a geometry change is a diff and not an argument someone
# remembered to pass.
#
# 720x1440 at scale 2 -> 360x720 logical is the original PinePhone's panel,
# measured on the device in moarchy. Phase 1 keeps it because matching the
# hardware moarchy already characterised is what makes the two comparable; a
# taller modern panel is a `--geometry` away and changes nothing structural.
# ---------------------------------------------------------------------------
[vm]
width   = "720"
height  = "1440"
scale   = "2"
# Cores and RAM for the guest. The PinePhone has 4x Cortex-A53 and 2 GB; this
# is deliberately NOT that. The VM exists to develop the UI without the
# hardware's limits, and software rendering wants the headroom. Squeezing back
# down to 2 GB is a test to run, not a default to live under.
smp     = "4"
memory  = "4096"
# Host port forwarded to the guest's sshd, and to wayvnc in headless mode.
ssh_port = "2222"
vnc_port = "5901"

# ---------------------------------------------------------------------------
# The guest's user. No password: the account is locked and getty autologins on
# tty1, the same arrangement moarchy ships. A VM reachable over a forwarded
# port with a known password would be a worse idea than it looks.
# ---------------------------------------------------------------------------
[guest]
user     = "omarchy"
hostname = "omarchy-mobile"

# ---------------------------------------------------------------------------
# Android, for Waydroid. Installed by scripts/vm-waydroid.sh, which is where
# the reasoning lives; these are the pins.
#
# `device` is the whole point of this section. Waydroid publishes both
# waydroid_arm64 and waydroid_arm64_only, and on a Mac only the second one
# boots: Apple Silicon has no AArch32, so every 32-bit binary in the arm64
# images exits 127, and boringssl_self_test32_vendor carries init's
# reboot_on_failure -- Android shut itself down 3.2s into every boot. Waydroid
# detects the CPU ("assuming arm64_only") and builds its channel URL from that
# string, so this is the channel it asks for and never gets when the images are
# preinstalled by hand.
#
# Pinned by filename AND by the sha256 the OTA channel publishes, because these
# are 2.3 GB of someone else's binaries arriving over http. Both are checked
# before the zips are unpacked and again, end to end, after the push into the
# guest. The channel keeps years of builds, so a pin stays fetchable; when one
# ages off, the fetch fails loudly rather than quietly taking the newest.
#
# Re-resolve with:
#   curl -s https://ota.waydro.id/system/lineage/waydroid_arm64_only/VANILLA.json
# ---------------------------------------------------------------------------
[waydroid]
channel     = "lineage"
device      = "waydroid_arm64_only"
system_type = "VANILLA"
vendor_type = "MAINLINE"
# lineage-20.0 is Android 13. VANILLA is the no-Google-apps build, which is the
# only kind this project would ship.
system_build  = "lineage-20.0-20260403-VANILLA-waydroid_arm64_only-system.zip"
system_sha256 = "c3cf6ab5ded7496761bae4a49fe1a6f691923c5b84818755790f3ae4e239127b"
vendor_build  = "lineage-20.0-20260403-MAINLINE-waydroid_arm64_only-vendor.zip"
vendor_sha256 = "bad5e84a2a47b877d8a85f6a212720f5562e3eeb26696bfd0e2de50dab1ec3ba"
