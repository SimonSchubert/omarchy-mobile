# manifest.toml -- the version pins.
#
# The only file in this project that says what version of anything is built.
# Nothing clones at HEAD: every input this project does not itself version
# names its upstream and an exact commit, so two builds of the same manifest
# install the same bytes.
#
# Read it from bash with scripts/manifest.sh:
#
#   . scripts/manifest.sh
#   ref=$(manifest_get omarchy ref) || exit 1
#
# A missing or empty pin is a hard error there, never an empty string -- an
# unread pin that degrades to "" is a clone at HEAD wearing a disguise, which
# is the exact failure these pins exist to prevent.

# ---------------------------------------------------------------------------
# Upstream Omarchy -- the configuration and theme layer we vendor.
#
# UNPATCHED, and that is the whole point of this project. moarchy carries
# pkgbuilds/omarchy-config/port-4x.patch, 264 insertions that rewrite
# Quickshell.Hyprland into Quickshell.I3 because a PinePhone's Mali-400 tops
# out at GLES 2.0 and Hyprland's floor is 3.0. A VM has no such floor: Mesa's
# llvmpipe advertises GLES 3.2 in software, so Hyprland runs and the patch is
# not needed. Phase 1 is upstream Omarchy, byte for byte.
#
# Same commit moarchy pins, deliberately: two ports of one upstream that
# disagree about which upstream are two projects.
# ---------------------------------------------------------------------------
[omarchy]
url     = "https://github.com/basecamp/omarchy"
ref     = "0534987009061cbe2dacdde4ad564092ab698d12"
version = "v4.0.3"

# ---------------------------------------------------------------------------
# This project's own version.
# ---------------------------------------------------------------------------
[omarchy-mobile]
version = "0.1.0"

# ---------------------------------------------------------------------------
# Packages Arch Linux ARM is behind on, built here from Arch's own packaging
# repo so the versions match what the rest of the repo expects.
#
# hyprland is the whole reason this section exists. ALARM's aarch64 [extra]
# carries hyprland 0.56.1-3, built 2026-08-01 against libaquamarine.so=13. It
# then rebuilt aquamarine to 0.15.0-2 on 2026-09-04, which provides
# libaquamarine.so=14 -- and never rebuilt hyprland. pacstrap says so plainly:
#
#   :: unable to satisfy dependency 'libaquamarine.so=13-64' required by hyprland
#
# Every other dependency lines up (hyprutils .so=13, hyprlang .so=2,
# hyprgraphics .so=4, hyprcursor .so=0, hyprwire .so=3), so exactly one package
# is stale. Arch x86_64 already shipped the answer: hyprland 0.56.2-2 depends on
# libaquamarine.so=14-64. Building that tag for aarch64 is the fix.
#
# Building hyprland rather than pinning aquamarine back to 0.14 is deliberate.
# An old aquamarine would need an IgnorePkg forever and would break again on
# the guest's first `pacman -Syu`; a newer hyprland is what ALARM is heading
# towards anyway, so when it catches up its package supersedes ours and this
# section can be deleted.
#
# `ref` is the commit the tag points at, not the tag, so a moved tag cannot
# quietly change what gets built.
# ---------------------------------------------------------------------------
[pkg.hyprland]
url     = "https://gitlab.archlinux.org/archlinux/packaging/packages/hyprland.git"
tag     = "0.56.2-2"
ref     = "b8035f2fd4540f4f88c747846388027dce715d5d"

# ---------------------------------------------------------------------------
# xdg-terminal-exec is not behind in ALARM but absent from it: it lives in the
# AUR. It is built here because every terminal Omarchy opens goes through it --
# omarchy-launch-floating-terminal-with-presentation execs
# `xdg-terminal-exec --app-id=org.omarchy.terminal ...` -- and without it
# uwsm-app logs one line and nothing appears:
#
#   uwsm_app-daemon: sent: error 'Error: Command not found: "xdg-terminal-exec"' 1
#
# Settings bridges forty-odd of upstream's rows that way (docs/spec/settings.md
# E), so on an image without it those rows are taps that do nothing.
#
# The AUR's git repo keeps the PKGBUILD at its root, the same shape as Arch's
# packaging repos, so vm/build-packages.sh builds it unchanged. The AUR has no
# tags: `tag` is the pkgver-pkgrel this commit builds, for reading, and `ref`
# is what is checked out. The PKGBUILD pins its source tarball by sha256, and
# that sum was checked against the tarball when this pin was taken.
# ---------------------------------------------------------------------------
[pkg.xdg-terminal-exec]
url     = "https://aur.archlinux.org/xdg-terminal-exec.git"
tag     = "0.14.3-1"
ref     = "a52e8f23c0be7d482b944c6cf5ddee172da171e4"

# ---------------------------------------------------------------------------
# The on-screen keyboard: moarchy's, at the commit moarchy pins, for the reason
# [omarchy] gives -- two ports of one phone UI that type through two different
# keyboards are two projects.
#
# In no repo at all, so it is built here like xdg-terminal-exec. It is a Qt6
# client of zwp_input_method_v2 and zwp_virtual_keyboard_v1, both of which
# Hyprland advertises as Sway does, and it owns sm.puri.OSK0 on the session
# bus, which is the name the shell calls to put it away (gestures.md F3, I5d).
#
# Its PKGBUILD is in packaging/ rather than at the root, which is what
# `pkgbuilddir` says. It builds the checkout it sits in (`source=()`), so this
# ref pins the code as well as its packaging.
#
# The trap moarchy's pin warns about is the same here. A commit can name a fix
# that pacman never offers: a guest holding 0.1.0-3 compares versions, not
# contents, so a fix reaches an installed guest only once the keyboard's own
# PKGBUILD has moved its pkgrel. A freshly built image hides that completely.
# ---------------------------------------------------------------------------
[pkg.moarchy-keyboard]
url         = "https://github.com/SimonSchubert/moarchy-keyboard"
tag         = "0.1.0-3"
ref         = "f1f2dda18f96c5ae087336410bc4178f405cba6f"
pkgbuilddir = "packaging"

# ---------------------------------------------------------------------------
# The aarch64 container everything is built in. Pinned by digest rather than
# by the `base-devel` tag: a floating tag is a clone at HEAD by another name.
#
# Re-resolve the tag to a digest with:
#   docker buildx imagetools inspect menci/archlinuxarm:base-devel
#
# Dockerfiles cannot read a file at FROM time, so this pin is written in two
# places -- here and in vm/Dockerfile. Keep them in step when bumping.
# ---------------------------------------------------------------------------
[builder]
image  = "menci/archlinuxarm"
tag    = "base-devel"
digest = "sha256:f7c6f64c0f246f41775e01793340c49f8e9abf3991141c25405361d56b100ccb"

# ---------------------------------------------------------------------------
# The VM. Not versions, but the numbers that define the target device -- they
# live here for the same reason the pins do: one place that answers "what is
# being built", so a geometry change is a diff and not an argument someone
# remembered to pass.
#
# 720x1440 at scale 2 -> 360x720 logical is the original PinePhone's panel,
# measured on the device in moarchy. Phase 1 keeps it because matching the
# hardware moarchy already characterised is what makes the two comparable; a
# taller modern panel is a `--geometry` away and changes nothing structural.
# ---------------------------------------------------------------------------
[vm]
width   = "720"
height  = "1440"
scale   = "2"
# Cores and RAM for the guest. The PinePhone has 4x Cortex-A53 and 2 GB; this
# is deliberately NOT that. The VM exists to develop the UI without the
# hardware's limits, and software rendering wants the headroom. Squeezing back
# down to 2 GB is a test to run, not a default to live under.
smp     = "4"
memory  = "4096"
# Host port forwarded to the guest's sshd, and to wayvnc in headless mode.
ssh_port = "2222"
vnc_port = "5901"

# ---------------------------------------------------------------------------
# The guest's user. No password: the account is locked and getty autologins on
# tty1, the same arrangement moarchy ships. A VM reachable over a forwarded
# port with a known password would be a worse idea than it looks.
# ---------------------------------------------------------------------------
[guest]
user     = "omarchy"
hostname = "omarchy-mobile"
